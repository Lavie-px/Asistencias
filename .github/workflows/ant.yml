name: Java CI - Ant

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Verificar Java
        run: java -version

      - name: Compilar con Ant
        run: ant -noinput -buildfile build.xml